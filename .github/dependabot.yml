version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: daily
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "ci"
    labels:
      - ci
      - github-actions

  - package-ecosystem: gomod
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: daily
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - go

  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: daily
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "container"
    labels:
      - dependencies
      - docker

  # The docs site doesn't ship in the package, so its updates use chore, which doesn't cut a
  # release. deps would, and every site dependency bump would publish a new release.
  - package-ecosystem: npm
    directory: /website
    open-pull-requests-limit: 10
    schedule:
      interval: daily
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
      - website
