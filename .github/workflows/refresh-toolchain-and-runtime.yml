name: Refresh Build and Runtime Pins

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: refresh-build-and-runtime-pins
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh Build and Runtime Pins
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Refresh Docker Go build image pin
        run: |
          latest_minor="$(go env GOVERSION | sed -E 's/^go([0-9]+\.[0-9]+).*/\1/')"
          sed -i "s/^ARG GO_VERSION=.*/ARG GO_VERSION=${latest_minor}/" Dockerfile

      # The refresh only changes Dockerfile pins, so it always changes the published image. It's
      # titled container:, like Dependabot's image updates, so it cuts a release.
      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            Dockerfile
          branch: automation/refresh-build-and-runtime-pins
          commit-message: "container: refresh build and runtime pins"
          title: "container: refresh build and runtime pins"
          body: |
            Refreshes the pinned Docker Go build image version in `Dockerfile`.
          delete-branch: true
          labels: |
            dependencies
            docker

      # A pull request opened with GITHUB_TOKEN doesn't run its pull_request workflows, so both
      # validations are dispatched on the branch. Without a release_ref, Container Image only
      # builds and smoke tests the image. The daily Dependabot Merge sweep merges the pull
      # request once both have passed.
      - name: Trigger pull request validation
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ steps.create-pr.outputs.pull-request-branch }}
        run: |
          set -euo pipefail
          gh workflow run build-and-validate.yml --ref "${PR_BRANCH}"
          gh workflow run container-image.yml --ref "${PR_BRANCH}"
