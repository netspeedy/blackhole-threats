name: Deploy Pages Site

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Publish Signed Debian Repository
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-pages-site
  cancel-in-progress: true

permissions:
  contents: read

env:
  WEBSITE_DIR: website

jobs:
  build:
    name: Build Pages Site
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore durable repository snapshot branch
        id: snapshot_branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          path: published-site
          persist-credentials: false
          ref: pages-snapshot

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Resolve latest published repository snapshot fallback
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh run list \
            --workflow publish-apt-repository.yml \
            --status success \
            --limit 1 \
            --json databaseId,headBranch,headSha,createdAt)"

          run_id="$(printf '%s' "${run_json}" | jq -r '.[0].databaseId // empty')"
          stable_tag="$(printf '%s' "${run_json}" | jq -r '.[0].headBranch // empty')"
          test -n "${run_id}"
          test -n "${stable_tag}"
          if ! [[ "${stable_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest successful APT repository publish was not a stable tag: ${stable_tag}" >&2
            exit 1
          fi

          stable_sha="$(git rev-list -n1 "${stable_tag}")"
          stable_build_date="$(gh release view "${stable_tag}" --json publishedAt --jq .publishedAt)"

          test -n "${stable_sha}"
          test -n "${stable_build_date}"

          {
            echo "run_id=${run_id}"
            echo "stable_tag=${stable_tag}"
            echo "stable_sha=${stable_sha}"
            echo "stable_build_date=${stable_build_date}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore latest published repository snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf pages-artifact site
          mkdir -p site

          if [ "${{ steps.snapshot_branch.outcome }}" = "success" ]; then
            rsync -a --delete --exclude '.git' published-site/ site/
          else
            mkdir -p pages-artifact
            gh run download "${{ steps.published.outputs.run_id }}" -n github-pages -D pages-artifact
            tar -xf pages-artifact/artifact.tar -C site
          fi

          test -f site/dists/stable/InRelease
          test -f site/blackhole-threats-archive-keyring.gpg
          test -f site/blackhole-threats-archive-keyring.fingerprint.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ env.WEBSITE_DIR }}/package-lock.json

      - name: Build Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.published.outputs.stable_tag }}
          STABLE_SHA: ${{ steps.published.outputs.stable_sha }}
        run: |
          # The site reads the release details at build time, so write them first. They describe
          # the stable release the restored APT snapshot was built from.
          metadata="${RUNNER_TEMP}/website-metadata.json"
          site_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fingerprint="$(tr '\n' ' ' < site/blackhole-threats-archive-keyring.fingerprint.txt | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//')"
          release_url="$(gh release view "${STABLE_TAG}" --json url --jq .url)"
          test -n "${fingerprint}"
          test -n "${release_url}"

          jq -n \
            --arg site_url "${site_url}" \
            --arg tag "${STABLE_TAG}" \
            --arg release_url "${release_url}" \
            --arg commit "${STABLE_SHA}" \
            --arg fingerprint "${fingerprint}" \
            '{
              site_url: $site_url,
              latest_release: {
                tag_name: $tag,
                html_url: $release_url
              },
              release_commit: $commit,
              apt_repository: {
                available: true,
                url: $site_url,
                suite: "stable",
                component: "main",
                key_url: ($site_url + "blackhole-threats-archive-keyring.gpg"),
                fingerprint: $fingerprint
              }
            }' > "${metadata}"

          npm ci --prefix "${WEBSITE_DIR}"
          SITE_METADATA_FILE="${metadata}" make website-build WEBSITE_DIR="${WEBSITE_DIR}"
          make website-check WEBSITE_DIR="${WEBSITE_DIR}"
          # The snapshot holds the previous site as well as the APT repository. Keep only the
          # repository and the metadata, so files the new site no longer has aren't left published.
          find site -mindepth 1 -maxdepth 1 ! -name dists ! -name pool \
            ! -name 'blackhole-threats-archive-keyring.*' ! -name website-metadata.json -exec rm -rf {} +
          cp -a "${WEBSITE_DIR}/dist/." site/
          cp "${metadata}" site/website-metadata.json
          touch site/.nojekyll
          test -f site/index.html
          test -f site/dists/stable/InRelease
          test -f site/website-metadata.json

      - name: Publish durable Pages snapshot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_root="$(mktemp -d)"
          trap 'rm -rf "${snapshot_root}"' EXIT
          git init -q "${snapshot_root}"
          cd "${snapshot_root}"
          git checkout --orphan pages-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a "${GITHUB_WORKSPACE}/site/." .
          git add --all
          git commit -m "pages: snapshot ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:pages-snapshot

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy Pages Site
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
